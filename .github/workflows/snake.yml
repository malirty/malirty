name: Generate snake

on:
  schedule:
    - cron: "23 * * * *"   # every hour: a new random route
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write    # lets the workflow keep itself enabled

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Draw snake (random route out of 10)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/snake/snake.py "${{ github.repository_owner }}" dist random

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # Re-enabling on every run resets that timer, so updates never stop.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/snake.yml/enable"

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
