<svg xmlns="http://www.w3.org/2000/svg" width="840" height="296" viewBox="0 0 840 296">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0b0e13"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E2B857" stop-opacity="0"/><stop offset=".5" stop-color="#E2B857"/><stop offset="1" stop-color="#E2B857" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    text{font:500 15px 'Fira Code','JetBrains Mono',Consolas,monospace}
    .cmd{fill:#e6edf3} .out{fill:#8b949e} .gold{fill:#F0D58C;font-weight:600} .p{fill:#E2B857}
    .ttl{font:500 12px 'Segoe UI',sans-serif;fill:#6e7681}
      </style>
  <rect x=".5" y=".5" width="839" height="295" rx="14" fill="url(#bg)" stroke="#2a2f37"/>
  <rect x="0" y="0" width="840" height="1.5" fill="url(#gl)"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="46" cy="24" r="6" fill="#febc2e"/><circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text x="420" y="28" class="ttl" text-anchor="middle">malirty@github: ~</text>
  <line x1="0" y1="44" x2="840" y2="44" stroke="#21262d"/>
  <text x="28" y="78" class="cmd" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.5s" fill="freeze"/><tspan class="p">$ </tspan>whoami</text>
  <text x="28" y="104" class="out" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.5s" fill="freeze"/>malirty — developer who ships things people actually use</text>
  <text x="28" y="130" class="cmd" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.50s" dur="0.5s" fill="freeze"/><tspan class="p">$ </tspan>cat focus.txt</text>
  <text x="28" y="156" class="out" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.5s" fill="freeze"/>→ Telegram bots &amp; AI agents that talk like humans</text>
  <text x="28" y="182" class="out" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.60s" dur="0.5s" fill="freeze"/>→ iOS &amp; desktop apps with obsessive attention to UI</text>
  <text x="28" y="208" class="out" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.5s" fill="freeze"/>→ automation: if I do it twice, I script it</text>
  <text x="28" y="234" class="cmd" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.70s" dur="0.5s" fill="freeze"/><tspan class="p">$ </tspan>echo $STATUS</text>
  <text x="28" y="260" class="gold" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.25s" dur="0.5s" fill="freeze"/>building Feadgram · open to collaboration</text>
  <rect x="28" y="272" width="9" height="17" fill="#E2B857"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/></rect>
</svg>
