<svg xmlns="http://www.w3.org/2000/svg" width="420" height="150" viewBox="0 0 420 150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E2B857"/><stop offset="1" stop-color="#E2B857" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .t{font:600 18px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#F0D58C}
    .d{font:400 13px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#9aa4b2}
    .l{font:500 12px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#c9d1d9}
    .b{font:600 10px 'Segoe UI',Ubuntu,sans-serif;fill:#E2B857;letter-spacing:.6px}
  </style>
  <rect x="0.5" y="0.5" width="419" height="149" rx="14" fill="url(#bg)" stroke="#2a2f37"/>
  <rect x="24" y="22" width="56" height="2" rx="1" fill="url(#line)"/>
  <text x="24" y="50" class="t">Feadgram</text>
  <rect x="340" y="34" width="56" height="20" rx="10" fill="none" stroke="#E2B857" stroke-opacity=".55"/>
  <text x="368.0" y="48" class="b" text-anchor="middle">PUBLIC</text>
  <text x="24" y="80" class="d">Telegram client for iOS with privacy</text>
  <text x="24" y="98" class="d">tools and local customization.</text>
  <circle cx="30" cy="125" r="5" fill="#F05138"/>
  <text x="42" y="129" class="l">Swift</text>
</svg>
