<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-labelledby="title desc">
  <title id="title">malirty.</title>
  <desc id="desc">TALENT. VISION. EXECUTION. A polished silver title with a seven-second moving highlight.</desc>
  <defs>
    <linearGradient id="steel" x1="0" x2="640" y1="0" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#43464b"/>
      <stop offset=".12" stop-color="#a7abb0"/>
      <stop offset=".24" stop-color="#f5f6f7"/>
      <stop offset=".31" stop-color="#747980"/>
      <stop offset=".43" stop-color="#d7d9dc"/>
      <stop offset=".52" stop-color="#3e4248"/>
      <stop offset=".63" stop-color="#bdc1c6"/>
      <stop offset=".71" stop-color="#ffffff"/>
      <stop offset=".78" stop-color="#73777d"/>
      <stop offset=".9" stop-color="#d8dade"/>
      <stop offset="1" stop-color="#43464b"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-640 0" to="0 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:112px;font-weight:800;letter-spacing:-8px}
    .tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;font-weight:600;letter-spacing:6px;fill:#8e9298}
    @media (prefers-color-scheme:light){.tag{fill:#60646b}}
  </style>
  <text class="name" x="450" y="122" text-anchor="middle" fill="url(#steel)">malirty.</text>
  <text class="tag" x="450" y="171" text-anchor="middle">TALENT. VISION. EXECUTION.</text>
</svg>
